<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaintStage Pro — See Your Room Painted Before You Commit</title>
    <meta name="description" content="Upload a photo of any room, pick a paint color, and see an AI-powered preview in seconds. Request a free estimate." />

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark:   '#1C2B3A',
                accent: '#C85A1E',
                accenthover: '#A84916',
                light:  '#FDF0E8',
                muted:  '#7A6352',
              },
              page: {
                bg: '#F8F6F3',
              }
            },
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- EmailJS — for sending estimate requests to Matt -->
    <!-- Sign up free at emailjs.com, then update the PUBLIC_KEY below and in App.tsx -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
      // Initialize EmailJS with your public key — get it from emailjs.com → Account → API Keys
      // TODO: Replace with your actual EmailJS public key
      window.addEventListener('DOMContentLoaded', function() {
        if (window.emailjs) {
          window.emailjs.init({ publicKey: 'YOUR_PUBLIC_KEY_HERE' });
        }
      });
    </script>

    <!-- React & Google GenAI via import map -->
    <script type="importmap">
      {
        "imports": {
          "react-dom/":        "https://aistudiocdn.com/react-dom@^19.1.1/",
          "react/":            "https://aistudiocdn.com/react@^19.1.1/",
          "react":             "https://aistudiocdn.com/react@^19.1.1",
          "@google/genai":     "https://aistudiocdn.com/@google/genai@^1.17.0"
        }
      }
    </script>

    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-page-bg text-brand-dark antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
